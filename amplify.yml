# AWS Amplify Hosting build spec.
#
# The dashboard lives in frontend/, so this is a monorepo build with appRoot —
# Amplify runs everything below from that directory.
#
# VITE_API_BASE_URL is NOT set here on purpose. Set it in the Amplify console
# (App settings → Environment variables) so the API host can change without a
# commit. Vite gives a real process env var priority over frontend/.env.production,
# so the console value wins over the file committed in the repo.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Vite 7 requires Node 20.19+; Amplify's default image may be older.
            - nvm install 22 && nvm use 22
            - node -v
            - npm ci
        build:
          commands:
            # Fail the build loudly rather than shipping a bundle pointed at
            # whatever host frontend/.env.production happens to contain.
            - test -n "$VITE_API_BASE_URL" || (echo "VITE_API_BASE_URL is not set in Amplify env vars" && exit 1)
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
